<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The Air</title>
    <style>
      :root { --ink: #16212c; --ink2: #5a6b7a; --bg: #f3f7fa; --card: #ffffff; --line: #dfe7ee; --accent: #1f7ae0; --accent2: #165fb3; --pos: #1f9d57; --neg: #d64545; --warn: #d9822b; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
      button { font-family: inherit; font-size: 15px; border: 0; border-radius: 12px; padding: 10px 14px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; min-height: 44px; }
      button:active { transform: scale(0.97); } button[disabled] { background: #c7d1da; color: #fff; cursor: default; }
      button.ghost { background: #e8eff6; color: var(--accent2); } button.danger { background: #fde8e8; color: var(--neg); } button.wide { width: 100%; margin: 6px 0; } button.back { background: transparent; color: var(--accent2); padding: 4px 0; min-height: 32px; }
      #app { display: grid; height: 100%; grid-template-rows: 56px 1fr 60px; grid-template-columns: 1fr; }
      #top { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #12202d; color: #fff; }
      #top .brand { font-weight: 800; letter-spacing: 0.3px; } #date { font-variant-numeric: tabular-nums; font-size: 15px; } #cash { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; } #cash.neg { color: #ff8a8a; } #rep { font-size: 13px; color: #b8c6d3; }
      #top .grow { flex: 1; }
      #speeds { display: flex; gap: 4px; } #speeds button { min-height: 38px; padding: 6px 12px; background: #243647; color: #fff; } #speeds button.on { background: var(--accent); }
      #menubtn { background: #243647; min-height: 38px; padding: 6px 12px; }
      #stage { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
      #mapwrap { position: relative; min-height: 0; } #map { width: 100%; height: 100%; display: block; touch-action: none; }
      #panel { overflow-y: auto; padding: 14px 16px 24px; background: var(--bg); border-left: 1px solid var(--line); }
      #panel h2 { margin: 4px 0 8px; font-size: 20px; } #panel h2 small { font-size: 13px; color: var(--ink2); font-weight: 600; } #panel h3 { margin: 16px 0 6px; font-size: 15px; }
      #panel .hint { color: var(--ink2); font-size: 13px; line-height: 1.5; margin: 6px 0; } #panel .steps { padding-left: 20px; line-height: 1.7; font-size: 14px; }
      .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; } .kv > div:nth-child(odd) { color: var(--ink2); } .kv > div:nth-child(even) { text-align: right; }
      .list { display: flex; flex-direction: column; gap: 8px; }
      .row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; } .row .grow { flex: 1; min-width: 0; } .row b { display: block; font-size: 15px; } .row small { display: block; color: var(--ink2); font-size: 12px; margin-top: 2px; line-height: 1.4; } .row .right { text-align: right; font-size: 13px; font-weight: 700; }
      .row.clickable { cursor: pointer; } .row.clickable:active { background: #eef3f8; }
      button.card { background: transparent; padding: 0; text-align: left; color: inherit; font-weight: 400; min-height: 0; width: 100%; }
      .pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); }
      button.small { min-height: 30px; padding: 4px 10px; font-size: 12px; margin-top: 4px; }
      .spark { width: 100%; height: 56px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; } .chartlabel { margin-top: 4px; } .cabin { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: -4px 0 8px 6px; } .cabin small { color: var(--ink2); } button.ghost.on { background: var(--accent); color: #fff; }
      .overlay .card2.wide { width: min(640px, 100%); max-height: 92vh; overflow-y: auto; } .overlay h4 { margin: 14px 0 6px; font-size: 13px; color: var(--ink2); }
      #setup { z-index: 45; }
      .scen { display: grid; gap: 8px; } .scen button { text-align: left; background: #eef3f8; color: var(--ink); border: 2px solid transparent; font-weight: 600; padding: 10px 14px; } .scen button small { display: block; font-weight: 400; color: var(--ink2); margin-top: 3px; line-height: 1.4; } .scen button.on { border-color: var(--accent); background: #e8f1fd; }
      .two3 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } #setup-base { width: 100%; min-height: 44px; font-size: 15px; border-radius: 10px; border: 1px solid var(--line); padding: 0 10px; }
      .seg { display: flex; gap: 6px; } .seg button { flex: 1; background: #eef3f8; color: var(--ink); padding: 8px 4px; } .seg button.on { background: var(--accent); color: #fff; } .hintline { display: block; margin-top: 6px; color: var(--ink2); line-height: 1.4; }
      .overlay .btns.row2 { flex-direction: row; } .overlay .btns.row2 button { flex: 1; } #records { margin-top: 10px; font-size: 13px; color: var(--ink2); line-height: 1.6; }
      #report { position: absolute; left: 10px; bottom: 14px; width: min(340px, 46%); background: #fffffff2; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px #0003; padding: 12px 14px; font-size: 13px; z-index: 6; line-height: 1.5; } #report[hidden] { display: none; }
      #report h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; } #report h4 button { min-height: 28px; padding: 2px 10px; font-size: 12px; } #report .rl { display: flex; justify-content: space-between; gap: 8px; } #report .rl span:last-child { text-align: right; font-weight: 700; } #report small { color: var(--ink2); }
      #fold { position: absolute; right: 10px; bottom: 14px; z-index: 5; min-height: 40px; width: 40px; padding: 0; border-radius: 12px; font-size: 18px; box-shadow: 0 4px 12px #0002; }
      #stage.full { grid-template-columns: 1fr 0; } #stage.full #panel { display: none; }
      #hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: min(94%, 700px); display: flex; align-items: center; gap: 10px; background: #12202df2; color: #fff; padding: 8px 8px 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px #0004; z-index: 6; } #hint[hidden] { display: none; }
      #hint button { white-space: nowrap; flex: none; min-height: 30px; padding: 3px 12px; font-size: 12px; border-radius: 999px; }
      .pulse { animation: ring 1.3s ease-out infinite; position: relative; z-index: 2; } @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(232, 121, 58, 0.85); } 100% { box-shadow: 0 0 0 14px rgba(232, 121, 58, 0); } }
      #fuel { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #243647; color: #cfe0ee; } #fuel.bad { background: #6a4a1c; color: #ffe2b0; } #fuel.good { background: #1c5a39; color: #c8f2d8; }
      .condbar { height: 6px; background: #e4ecf3; border-radius: 4px; overflow: hidden; margin-top: 4px; width: 120px; } .condbar i { display: block; height: 100%; background: var(--pos); } .condbar i.mid { background: var(--warn); } .condbar i.low { background: var(--neg); }
      #eco { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #243647; color: #cfe0ee; } #eco.good { background: #1c5a39; color: #c8f2d8; } #eco.bad { background: #6a2424; color: #ffd0d0; }
      #alerts { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 5; }
      #alerts .chip { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: #fff7e8; border: 1px solid #f0c98a; color: #6b4a14; border-radius: 12px; padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 14px #0002; max-width: 560px; }
      #alerts .chip b { font-weight: 800; } #alerts .chip .grow { flex: 1; cursor: pointer; } #alerts .chip button { min-height: 32px; padding: 4px 10px; font-size: 12px; background: #e8793a; } #alerts .chip.new { animation: pulse 1.2s ease-in-out 3; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 5px #f0c98a88, 0 4px 14px #0002; } }
      #tabs button { position: relative; } #tabs button[data-badge]::after { content: attr(data-badge); position: absolute; top: 8px; right: calc(50% - 30px); min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; background: #e8453a; color: #fff; font-size: 11px; font-weight: 800; padding: 0 5px; text-align: center; }
      .stepper { display: flex; gap: 6px; } .stepper button { padding: 6px 12px; min-width: 44px; }
      .two { display: flex; justify-content: space-between; }
      input[type=range] { width: 100%; height: 44px; accent-color: var(--accent); }
      .goal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
      .bar { height: 10px; background: #e4ecf3; border-radius: 6px; overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, #4ba3ff, var(--accent)); } .goal small { color: var(--ink2); }
      .chart { display: flex; align-items: flex-end; gap: 3px; height: 62px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 8px; } .chart i { flex: 1; border-radius: 3px 3px 0 0; } .chart i.p { background: var(--pos); } .chart i.n { background: var(--neg); }
      #tabs { display: flex; background: #12202d; } #tabs button { flex: 1; border-radius: 0; background: transparent; color: #aebccb; font-size: 14px; min-height: 60px; } #tabs button.on { color: #fff; background: #1c3145; box-shadow: inset 0 3px 0 var(--accent); }
      #toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%) translateY(20px); background: #12202dee; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: all 0.25s; pointer-events: none; max-width: 90vw; text-align: center; z-index: 30; } #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      #menu { position: fixed; top: 60px; right: 10px; width: 220px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px #0003; padding: 8px; z-index: 20; display: flex; flex-direction: column; gap: 6px; } #menu[hidden] { display: none; } #menu button { background: #eef3f8; color: var(--ink); text-align: left; }
      .overlay { position: fixed; inset: 0; background: rgba(10, 20, 30, 0.55); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; } .overlay[hidden] { display: none; }
      .overlay .card2 { width: min(460px, 100%); background: #fff; border-radius: 22px; padding: 28px; box-shadow: 0 20px 60px #0005; } .overlay h1 { margin: 0 0 6px; font-size: 36px; letter-spacing: -0.5px; background: linear-gradient(90deg, #1f7ae0, #1fb5a4); -webkit-background-clip: text; background-clip: text; color: transparent; } .overlay p { color: var(--ink2); line-height: 1.6; font-size: 14px; } .overlay .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
      @media (max-width: 820px) {
        #stage { grid-template-columns: 1fr; grid-template-rows: 46% 1fr; } #stage.full { grid-template-columns: 1fr; grid-template-rows: 1fr 0; } #panel { border-left: 0; border-top: 1px solid var(--line); }
        #top { gap: 6px; padding: 0 8px; } #top .brand, #rep { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="top">
        <span class="brand">The Air</span><span id="date"></span><span id="cash"></span><span id="rep"></span><span id="eco"></span><span id="fuel"></span><span class="grow"></span>
        <div id="speeds"><button data-speed="0" aria-label="일시정지">⏸</button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div>
        <button id="menubtn">메뉴</button>
      </header>
      <main id="stage"><div id="mapwrap"><canvas id="map"></canvas><div id="alerts"></div><button id="fold" aria-label="패널 접기·펴기" title="패널 접기·펴기">⤢</button><div id="report" hidden></div><div id="hint" hidden><span id="hint-text"></span><button id="hint-off" class="ghost">힌트 끄기</button></div></div><aside id="panel"></aside></main>
      <nav id="tabs"><button data-tab="map">지도</button><button data-tab="routes">노선</button><button data-tab="fleet">기단</button><button data-tab="money">재무</button><button data-tab="news">알림</button></nav>
    </div>
    <div id="menu" hidden><button data-m="save">저장</button><button data-m="load">불러오기</button><button data-m="new">새 게임</button><button data-m="hints">힌트: 켜짐</button><button data-m="sound">소리: 켜짐</button><button data-m="music">배경 음악: 켜짐</button><button data-m="night">낮밤 표시: 켜짐</button><button data-m="help">조작 도움말</button><button data-m="autopause">사건 시 자동 정지: 켜짐</button><button data-m="title">시작 화면</button></div>
    <div id="toast"></div>
    <div id="end" class="overlay" hidden><div class="card2"><h1 id="end-title" style="font-size:28px"></h1><p id="end-body"></p><div class="btns"><button id="end-continue" hidden>계속하기 (자유 모드)</button><button id="end-new" class="ghost">새 게임</button></div></div></div>
    <div id="setup" class="overlay" hidden><div class="card2 wide"><h1 style="font-size:26px">새 게임</h1>
      <h4>시나리오</h4><div id="setup-scen" class="scen"></div>
      <div class="two3"><div><h4>시작 도시</h4><select id="setup-base"></select><small id="setup-baselock" class="hintline"></small></div>
      <div><h4>난이도</h4><div id="setup-diff" class="seg"><button data-d="easy">쉬움</button><button data-d="normal">보통</button><button data-d="hard">어려움</button></div><small id="setup-diffnote" class="hintline"></small></div></div>
      <div class="btns row2"><button id="setup-go">시작</button><button id="setup-cancel" class="ghost">취소</button></div></div></div>
    <div id="title" class="overlay"><div class="card2"><h1>The Air</h1><p>가상의 항공사 사장이 되어 지구 위 도시 사이에 노선을 열고, 항공기를 사서 배정하고, 운임을 정해 이익을 내세요. 현금이 바닥나면 파산입니다. <span id="t-version"></span></p>
      <p>시나리오(자유 경영·감염병 위기·유럽 허브·저가 항공 도전)와 시작 도시, 난이도를 골라 시작하세요.</p><div class="btns"><button id="t-new">새 게임</button><button id="t-continue" class="ghost" hidden>이어하기</button></div><div id="records"></div></div></div>
    <script type="module" src="/airline/src/main.ts"></script>
  </body>
</html>
