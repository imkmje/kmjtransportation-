<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>카 컴퍼니</title>
  </head>
  <body>
    <div id="app">
      <header id="top">
        <span class="top-date" id="date"></span>
        <span class="top-cash" id="cashpill"><span id="cash-l" class="sr-only">현금</span><b id="cash"></b><small id="hqcash" hidden></small></span>
        <button class="plchip" id="plchip" hidden aria-label="지난달 손익. 눌러서 재무 화면 보기"><span class="pl-t">지난달</span><b id="pl"></b></button>
        <button class="pill hqback" id="hqback" hidden aria-label="본사 화면으로 돌아가기">← 본사로</button>
        <div class="sp"></div>
        <button class="decbtn" id="decbtn" hidden aria-label="정할 일 보기">정할 일 <b id="dec-n">0</b>건</button>
        <div class="speeds" id="speeds" role="group" aria-label="빠르기">
          <button data-speed="0" aria-label="멈춤"><span class="sp-t">멈춤</span><span class="sp-i" aria-hidden="true">❚❚</span></button><button data-speed="1" title="1주 3초" aria-label="보통"><span class="sp-t">보통</span><span class="sp-i" aria-hidden="true">▶</span></button><button data-speed="2" title="1주 1.5초" aria-label="빠름"><span class="sp-t">빠름</span><span class="sp-i" aria-hidden="true">▶▶</span></button><button data-speed="4" title="1주 0.75초" aria-label="아주 빠름"><span class="sp-t">아주 빠름</span><span class="sp-i" aria-hidden="true">▶▶▶</span></button>
        </div>
        <span class="held" id="held" hidden>결정 중 · 멈춤</span>
        <button class="skipbtn" id="skipbtn" aria-pressed="false" title="결정할 일이 생길 때까지 가장 빠르게 진행합니다(최대 2년)">다음 일까지</button>
        <button class="menubtn" id="menubtn" aria-haspopup="true" aria-expanded="false" aria-controls="topmenu">메뉴</button>
        <div class="topmenu" id="topmenu" hidden role="group" aria-label="메뉴">
          <div class="brand"><span id="mylogo"></span><span id="co"></span></div>
          <span class="pill">평판 <b id="rep"></b><span class="ib" role="button" tabindex="0" data-info="term:평판" aria-label="평판 설명"></span></span>
          <button class="pill evchip" id="evchip" hidden aria-label="진행 중인 시대 사건 보기"></button>
          <button class="pill pend" id="pend" hidden aria-label="결정을 기다리는 사건 보기"></button>
          <button class="pill todo" id="todobtn" aria-label="할 일과 임원 보고 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2M4 12h2M4 18h2M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span class="td-t">할 일·보고·알림</span><b id="todo-n">0</b></button>
          <button class="menubtn mutebtn" id="mutebtn" aria-label="소리 끄기" aria-pressed="false"></button>
          <button class="btn ink" id="menusave">저장·설정</button>
        </div>
      </header>
      <div class="alertbar" id="alertbar" hidden role="status"></div>
      <main id="main">
        <aside id="side" hidden aria-label="내 차 목록"></aside>
        <section class="stage" id="stage">
          <canvas id="cv" aria-label="자동차 3D 무대. 끌어서 돌려 볼 수 있습니다."></canvas>
          <div class="fallback" id="fb" hidden></div>
          <div id="office" hidden></div>
          <div id="ov"></div>
        </section>
        <section id="keys" hidden aria-label="핵심 수치"></section>
        <section id="panel" aria-live="polite"></section>
      </main>
      <nav id="tabs" aria-label="주 메뉴">
        <button data-tab="today">오늘</button><button data-tab="car">차</button><button data-tab="research">연구</button><button data-tab="people">사람</button><button data-tab="group">그룹</button><button data-tab="market">시장</button><button data-tab="fin">재무</button>
      </nav>
    </div>

    <div id="title" class="cover" hidden></div>
    <div id="sheet" class="sheet" hidden><div class="report" id="sheet-body" role="dialog" aria-modal="true"></div></div>
    <div id="pick" class="sheet ask" hidden><div class="report small pastpick" role="dialog" aria-modal="true" aria-label="지난 판의 차 이름" id="pick-body"></div></div>
    <div id="ask" class="sheet ask" hidden><div class="report small" role="alertdialog" aria-modal="true"><p id="ask-text"></p><div class="row end"><button class="btn" id="ask-no">아니요</button><button class="btn ink" id="ask-yes">예</button></div></div></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="debug" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
