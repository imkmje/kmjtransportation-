<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>교통 시뮬레이션</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      button { font-family: inherit; }
      /* ---- 위쪽 바: 왼쪽 수요 막대·정체 지수 / 가운데 시계 / 오른쪽 배속·메뉴 ---- */
      #hud { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 10px; box-sizing: border-box; background: linear-gradient(#1d2a33f2, #1d2a33d9); color: #fff; box-shadow: 0 2px 8px #0004; z-index: 10; }
      #tb-left, #tb-right { display: flex; align-items: center; gap: 12px; } #tb-right { justify-content: flex-end; }
      #tb-center { text-align: center; position: relative; }
      #clock { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
      #note { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); padding: 4px 10px; background: #ffe9a8; color: #3a3220; border-radius: 6px; font-size: 13px; white-space: nowrap; }
      #note:empty { display: none; }
      #version { font-size: 11px; color: #a9bac4; }
      #rci { display: flex; gap: 6px; align-items: flex-end; }
      #rci .rb { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 28px; } #rci .rb em { font-style: normal; font-size: 9px; color: #b9c8d0; }
      #rci .rb span { width: 12px; height: 28px; background: #ffffff2e; border-radius: 3px; display: flex; align-items: flex-end; overflow: hidden; } #rci .rb i { display: block; width: 100%; height: 0; }
      #rci .rb:nth-child(1) i { background: #6fcf7e; } #rci .rb:nth-child(2) i { background: #3fae5a; } #rci .rb:nth-child(3) i { background: #1f8a45; } #rci .rb:nth-child(4) i { background: #4f86d6; } #rci .rb:nth-child(5) i { background: #9a6fd1; } #rci .rb:nth-child(6) i { background: #e8b93c; } #rci .rb:nth-child(7) i { background: #4fc7b0; }
      #topci { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; background: #55655a; white-space: nowrap; }
      #speeds { display: flex; gap: 3px; background: #ffffff1f; padding: 3px; border-radius: 8px; }
      #speeds button { padding: 5px 11px; border: 0; border-radius: 6px; background: transparent; color: #fff; font-size: 14px; cursor: pointer; }
      #speeds button.on { background: #f2a65a; color: #1d2a33; font-weight: 700; }
      #menubtn { padding: 7px 12px; border: 0; border-radius: 8px; background: #ffffff2e; color: #fff; font-size: 13px; cursor: pointer; }
      /* ---- 메뉴 창 ---- */
      #filebar { position: fixed; top: 54px; right: 8px; width: 300px; max-height: calc(100vh - 80px); overflow-y: auto; padding: 12px; box-sizing: border-box; background: #fffffff2; border-radius: 10px; box-shadow: 0 6px 24px #0003; z-index: 12; color: #1f2a22; }
      #filebar[hidden] { display: none; }
      #filebar h4 { margin: 0 0 8px; font-size: 13px; color: #4a5a4d; }
      #filebar .mrow { display: flex; gap: 6px; margin-bottom: 6px; } #filebar .mrow > * { flex: 1; }
      #filebar button, #filebar select { padding: 8px 10px; border: 0; border-radius: 8px; background: #e6ede2; cursor: pointer; font-size: 13px; }
      #filebar > button { width: 100%; margin-bottom: 6px; }
      #filebar .help { margin-top: 8px; font-size: 11px; line-height: 1.55; color: #4a5a4d; }
      #msg { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: 11; max-width: 80vw; font-size: 13px; pointer-events: none; }
      #msg:not(:empty) { background: #1d2a33ee; color: #fff; border-radius: 8px; padding: 6px 14px; }
      /* ---- 오른쪽 통계 창(머리글을 누르면 접힘) ---- */
      #stats { position: fixed; top: 58px; right: 8px; width: 250px; padding: 10px 12px; background: #fffffff0; border-radius: 10px; box-shadow: 0 4px 16px #0002; font-size: 13px; color: #1f2a22; z-index: 5; }
      #stats h4 { margin: 0 0 6px; font-size: 12px; color: #4a5a4d; font-weight: 600; cursor: pointer; } #stats h4 em { font-style: normal; float: right; }
      #stats.closed #st-body { display: none; } #stats.closed h4 { margin: 0; }
      #stats .ci { display: flex; align-items: baseline; gap: 8px; }
      #stats .ci b { font-size: 34px; line-height: 1; } #stats .ci span { font-weight: 700; }
      #stats .gauge { position: relative; height: 10px; border-radius: 5px; margin: 8px 0 10px; background: linear-gradient(90deg,#4caf6a 0 10%,#a5cf5b 10% 25%,#f0b13a 25% 40%,#e8743a 40% 60%,#c93c34 60% 100%); }
      #stats .gauge i { position: absolute; top: -4px; width: 4px; height: 18px; background: #1d2630; border-radius: 2px; transform: translateX(-2px); }
      #stats .kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; margin-top: 4px; }
      #stats .kv div:nth-child(odd) { color: #55655a; } #stats .kv div:nth-child(even) { font-weight: 700; text-align: right; }
      #stats svg { margin-top: 8px; display: block; } #stats .goals { margin: 6px 0 0; padding: 0; list-style: none; font-size: 11px; } #stats .goals span { color: #55655a; display: block; margin-left: 14px; } #stats .yday { margin-top: 6px; font-size: 11px; color: #55655a; }
      #help { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: #1d2a3380; }
      #help[hidden] { display: none; }
      #help .card { width: min(820px, 94vw); max-height: 88vh; overflow-y: auto; background: #fffffff5; border-radius: 14px; padding: 18px 22px; box-shadow: 0 10px 40px #0005; color: #1f2a22; }
      #help h3 { margin: 0 0 10px; font-size: 18px; } #help h3 button { float: right; border: 0; background: none; font-size: 16px; cursor: pointer; }
      #help .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 22px; }
      #help h4 { margin: 10px 0 4px; font-size: 13px; color: #4a5a4d; } #help .r { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; font-size: 13px; }
      #help kbd { min-width: 70px; display: inline-block; padding: 1px 6px; border-radius: 5px; background: #e6ede2; border: 1px solid #c8d4c4; font: 600 12px ui-monospace, monospace; text-align: center; }
      #toolbar .sub label.chip { background: #e6ede2; border-radius: 8px; padding: 8px 10px; }
      #info { position: fixed; top: 58px; left: 8px; width: 250px; padding: 10px 12px; background: #fffffff0; border-radius: 10px; box-shadow: 0 4px 16px #0002; font-size: 13px; color: #1f2a22; z-index: 5; }
      #info[hidden] { display: none; }
      #info h4 { margin: 0 0 6px; font-size: 12px; color: #4a5a4d; font-weight: 600; } #info h4 button { float: right; border: 0; background: none; cursor: pointer; font-size: 13px; }
      #info .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; } #info .kv div:nth-child(odd) { color: #55655a; } #info .kv div:nth-child(even) { font-weight: 600; text-align: right; }
      #info .sub-h { margin: 10px 0 4px; font-size: 11px; color: #4a5a4d; font-weight: 600; } #info .seg3 { display: flex; gap: 4px; } #info .seg3 button { flex: 1; padding: 7px 0; border: 0; border-radius: 8px; background: #e6ede2; cursor: pointer; } #info .seg3 button.on { background: #f2a65a; font-weight: 700; }
      #info .ph { display: flex; align-items: center; gap: 6px; margin: 3px 0; } #info .ph span { flex: 1; font-size: 12px; } #info .ph b { min-width: 38px; text-align: center; } #info .ph button:disabled { opacity: .3; cursor: default; } #info .ph button { width: 26px; height: 26px; border: 0; border-radius: 6px; background: #e6ede2; cursor: pointer; }
      #info button.wide { width: 100%; margin-top: 6px; padding: 7px 6px; border: 0; border-radius: 8px; background: #e6ede2; cursor: pointer; font-size: 12px; }
      #info .namebox { display: flex; gap: 4px; margin-top: 8px; } #info .namebox input { flex: 1; min-width: 0; padding: 6px; border: 1px solid #cfd9cf; border-radius: 6px; } #info .namebox button { border: 0; border-radius: 6px; background: #e6ede2; cursor: pointer; padding: 0 8px; }
      #info .two { display: flex; gap: 6px; } #info .two .wide { flex: 1; } #info .hint { font-size: 11px; color: #55655a; margin-top: 3px; }
      #info .ln { display: flex; align-items: center; gap: 4px; margin: 2px 0; } #info .ln span { flex: 1; font-size: 12px; } #info .ln button { width: 30px; height: 26px; border: 0; border-radius: 6px; background: #e6ede2; cursor: pointer; color: #8a9a8d; } #info .ln button.on { background: #f2a65a; color: #1d2a33; font-weight: 700; }
      #info #in-up { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #f2a65a; font-weight: 700; cursor: pointer; }
      #stats .top-h { margin: 8px 0 2px; cursor: default; } #st-top { margin: 0; padding-left: 18px; font-size: 12px; } #st-top li { cursor: pointer; padding: 1px 0; } #st-top li:hover { background: #f2a65a33; } #st-top li.none { cursor: default; list-style: none; margin-left: -18px; color: #55655a; } #st-top small { color: #55655a; }
      /* ---- 아래쪽 도구 모음: 분류 버튼 줄 + 위로 열리는 도구 상자 ---- */
      #toolbar { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 98vw; z-index: 6; }
      #toolbar .subs { max-width: 98vw; }
      #toolbar .sub { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; padding: 8px 10px; background: #fffffff2; border-radius: 12px; box-shadow: 0 4px 16px #0003; }
      #toolbar .sub[hidden] { display: none; }
      #toolbar .sub button { padding: 9px 14px; border: 0; border-radius: 8px; background: #e6ede2; cursor: pointer; font-size: 13px; }
      #toolbar .sub button.on { background: #f2a65a; font-weight: 700; }
      #toolbar .sub button.z-home { border-bottom: 4px solid #6fcf7e; } #toolbar .sub button.z-homeMid { border-bottom: 4px solid #3fae5a; } #toolbar .sub button.z-homeHigh { border-bottom: 4px solid #1f8a45; } #toolbar .sub button.z-industrial { border-bottom: 4px solid #e8b93c; } #toolbar .sub button.z-shop { border-bottom: 4px solid #4f86d6; } #toolbar .sub button.z-office { border-bottom: 4px solid #9a6fd1; } #toolbar .sub button.z-mixed { border-bottom: 4px solid #4fc7b0; }
      #toolbar .sub select { padding: 8px; border: 0; border-radius: 8px; background: #e6ede2; font-size: 13px; }
      #toolbar .sub label { font-size: 12px; padding: 4px 8px; color: #1f2a22; } #toolbar .opts { display: flex; flex-wrap: wrap; gap: 2px 6px; border-left: 1px solid #cfd9cf; margin-left: 4px; padding-left: 6px; }
      #toolbar .cats { display: flex; align-items: stretch; gap: 6px; padding: 8px; background: linear-gradient(#2b3b46fa, #1b2830fa); border-radius: 16px; border: 1px solid #ffffff22; box-shadow: 0 6px 20px #0006, inset 0 1px 0 #ffffff26; max-width: 98vw; overflow-x: auto; }
      #toolbar .cats button { min-width: 70px; padding: 8px 10px 7px; border: 1px solid #ffffff1f; border-radius: 12px; background: linear-gradient(#ffffff2e, #ffffff12); color: #eaf1f5; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: background .12s, transform .12s; }
      #toolbar .cats button:hover { background: linear-gradient(#ffffff40, #ffffff1c); transform: translateY(-1px); }
      #toolbar .cats button svg { width: 28px; height: 28px; }
      #toolbar .cats button.small { min-width: 48px; font-size: 10px; font-weight: 500; } #toolbar .cats button.small svg { width: 24px; height: 24px; }
      #toolbar .cats button.on { background: linear-gradient(#ffc27a, #f2a65a); color: #1d2a33; border-color: #ffd9a8; box-shadow: 0 0 12px #f2a65a88; }
      #toolbar .cats button:disabled { opacity: 0.35; cursor: default; transform: none; }
      #toolbar .cats i { width: 1px; background: #ffffff33; margin: 6px 2px; }
      #legend { position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 5px 10px; background: #fffd; border-radius: 8px; font-size: 12px; z-index: 4; }
      #legend[hidden] { display: none; }
      #legend span { display: flex; align-items: center; gap: 4px; } #legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
      #title { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: #cfe8f7e6; }
      #title[hidden] { display: none; }
      #title .card { width: min(560px, 92vw); max-height: 88vh; display: flex; flex-direction: column; background: #fffffff2; border-radius: 14px; padding: 22px 24px; box-shadow: 0 8px 30px #0003; color: #1f2a22; }
      #title h1 { margin: 0 0 4px; font-size: 28px; } #title .sub { margin: 0 0 14px; font-size: 13px; color: #55655a; }
      #title .btns { display: flex; gap: 8px; margin-bottom: 14px; }
      #title .btns button { padding: 10px 18px; border: 0; border-radius: 8px; background: #f2a65a; font-weight: 700; font-size: 15px; cursor: pointer; }
      #title .btns button#t-auto { background: #e3eadf; font-weight: 500; }
      #title h4 { margin: 0 0 6px; font-size: 13px; color: #4a5a4d; }
      #title .hist { overflow-y: auto; font-size: 13px; line-height: 1.55; border-top: 1px solid #dfe8df; padding-top: 6px; }
      #title details { margin: 4px 0; } #title summary { cursor: pointer; padding: 3px 0; } #title summary span { color: #7a887d; font-size: 11px; margin-left: 6px; }
      #title h5 { margin: 8px 0 2px; font-size: 12px; color: #4a5a4d; } #title ul { margin: 0 0 4px; padding-left: 18px; } #title p { margin: 4px 0; }
      #tip { position: fixed; z-index: 5; pointer-events: none; padding: 3px 8px; background: #2c3e2f; color: #fff; border-radius: 6px; font-size: 13px; white-space: nowrap; }
      #tip.bad { background: #c0392b; }
      #debug { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; background: #1d2630d9; color: #fff; border-radius: 8px; font: 12px/1.5 ui-monospace, monospace; white-space: pre; pointer-events: none; }
      #debug[hidden] { display: none; }
      #labels .lbl { position: fixed; transform: translate(-50%, -50%); padding: 0 4px; border-radius: 3px; font: 10px ui-monospace, monospace; color: #fff; pointer-events: none; white-space: nowrap; }
      #labels .lane { background: #1f6fc6cc; } #labels .veh { background: #c4601ccc; transform: translate(-50%, -170%); }
      #debug { top: 56px !important; }

      /* ===== 디자인 정리(2.3.0): 글꼴·유리 질감 패널·부드러운 눌림 효과·시작 화면 ===== */
      :root { --ink: #1c2b25; --ink2: #55655a; --accent: #f2a65a; --accent2: #e8893c; --glass: rgba(252, 254, 251, 0.84); --glass-dark: rgba(22, 32, 40, 0.72); --line: rgba(255, 255, 255, 0.55); --shadow: 0 10px 34px rgba(20, 35, 30, 0.22), 0 2px 6px rgba(20, 35, 30, 0.12); }
      html, body { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink); }
      #hud { background: var(--glass-dark) !important; backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border-bottom: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 4px 18px rgba(10, 20, 25, 0.25); }
      #clock { font-variant-numeric: tabular-nums; letter-spacing: 0.4px; text-shadow: 0 1px 2px #0006; }
      #speeds { background: rgba(255, 255, 255, 0.12) !important; } #speeds button { transition: background 0.15s, transform 0.1s; } #speeds button:hover { background: rgba(255, 255, 255, 0.16); } #speeds button.on { background: linear-gradient(#f7b772, var(--accent2)) !important; box-shadow: 0 2px 6px #0004; }
      #menubtn { transition: background 0.15s; } #menubtn:hover { background: rgba(255, 255, 255, 0.28) !important; }
      #topci { box-shadow: 0 1px 4px #0004; }
      #stats, #filebar, #info, #help .card, #legend { background: var(--glass) !important; backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35); border: 1px solid var(--line); border-radius: 16px !important; box-shadow: var(--shadow) !important; }
      #stats h4, #info h4 { letter-spacing: 0.2px; }
      #stats .kv > div:nth-child(odd) { color: var(--ink2); }
      #stats .ci b { font-variant-numeric: tabular-nums; }
      #toolbar .sub { background: var(--glass) !important; backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35); border: 1px solid var(--line); border-radius: 16px !important; box-shadow: var(--shadow) !important; }
      #toolbar .sub button, #toolbar .sub label.chip { transition: background 0.15s, transform 0.08s, box-shadow 0.15s; }
      #toolbar .sub button:hover { background: #d8e5d2; } #toolbar .sub button:active { transform: scale(0.97); }
      #toolbar .sub button.on { background: linear-gradient(#f7b772, var(--accent2)); color: #2a1c0c; box-shadow: 0 2px 8px rgba(232, 137, 60, 0.45); }
      #toolbar .cats { background: var(--glass-dark) !important; backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 18px !important; box-shadow: var(--shadow) !important; }
      #note { box-shadow: 0 4px 14px #0003; border-radius: 10px !important; }
      #msg { border-radius: 12px !important; box-shadow: 0 6px 20px #0004; }
      /* 시작 화면 */
      #title { background: radial-gradient(120% 90% at 50% 30%, rgba(214, 236, 252, 0.55), rgba(24, 46, 58, 0.62)) !important; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
      #title .card { background: var(--glass) !important; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); border-radius: 22px !important; box-shadow: 0 20px 60px rgba(10, 25, 30, 0.35) !important; padding: 30px 32px !important; }
      #title h1 { font-size: 34px !important; letter-spacing: -0.5px; background: linear-gradient(90deg, #1f6f5a, #2f7fbf); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #title .btns button { background: linear-gradient(#f7b772, var(--accent2)) !important; box-shadow: 0 4px 14px rgba(232, 137, 60, 0.45); border-radius: 12px !important; padding: 12px 26px !important; transition: transform 0.1s, box-shadow 0.15s; } #title .btns button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(232, 137, 60, 0.55); }
      #title .btns button#t-auto { background: #e6ede2 !important; box-shadow: none; }
      #title details.histwrap > summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink2); padding: 6px 0; list-style: none; } #title details.histwrap > summary::before { content: "▸ "; } #title details.histwrap[open] > summary::before { content: "▾ "; }
      #title .hist { max-height: 46vh; overflow-y: auto; margin-top: 4px; }

      #info { max-height: calc(100vh - 150px); overflow-y: auto; }
      #info .appr { margin: 8px 0; padding: 8px; background: #eef3ea; border-radius: 12px; } #info .appr:hover { outline: 2px solid #4f86d6; }
      #info .appr-h { font-weight: 700; font-size: 13px; margin-bottom: 6px; } #info .appr-h small { font-weight: 400; color: #55655a; margin-left: 4px; }
      #info .lanes { display: flex; gap: 4px; justify-content: center; margin-bottom: 6px; }
      #info .lcard { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; background: #fff; border-radius: 8px; box-shadow: inset 0 -3px 0 #c9d4c4; }
      #info .lcard em { font-style: normal; font-size: 10.5px; color: #55655a; text-align: center; line-height: 1.2; }
      #info .lbtns { display: flex; flex-direction: column; gap: 3px; } #info .lbtns button { width: 34px; height: 28px; border: 0; border-radius: 7px; background: #e1e8dd; color: #7c887f; cursor: pointer; font-size: 16px; font-weight: 700; transition: background 0.12s; } #info .lbtns button.on { background: linear-gradient(#f7b772, #e8893c); color: #2a1c0c; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="hud"></div>
    <div id="toolbar"></div>
    <div id="filebar"></div>
    <div id="msg"></div>
    <div id="stats"></div>
    <div id="info" hidden></div>
    <div id="legend" hidden></div>
    <div id="tip" hidden></div>
    <div id="debug" hidden></div>
    <div id="labels"></div>
    <div id="title" hidden></div>
    <div id="help" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
