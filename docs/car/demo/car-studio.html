<title>카 컴퍼니 3D 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 밝은 촬영 스튜디오(3D 회전 무대)가 화면의 주인공. 글자는 무대 위에 얹고, 아래 도크에서 부품을 고른다. 한 가지 밝은 테마로 고정. */
:root{
  --bg:#e7eaee; --stage1:#ffffff; --stage2:#dfe4ea; --stage3:#c9d0d9;
  --card:#ffffff; --ink:#14171c; --ink2:#5b6470; --ink3:#8b94a1; --line:#d8dde4; --soft:#f1f3f6;
  --accent:#ff5a1f; --accent2:#c93f0c; --pos:#12915a; --neg:#d43c3c;
  --kr:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --num:"Barlow Condensed","Gothic A1",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
.app{max-width:1120px;margin:0 auto;padding:12px 0 40px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* 상단 */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;letter-spacing:-.01em}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:baseline;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink2)}
.pill b{font-family:var(--num);font-size:17px;color:var(--ink);font-weight:600}

/* 무대 */
.stage{position:relative;border-radius:24px;overflow:hidden;height:clamp(330px,58vh,580px);
  background:radial-gradient(120% 90% at 50% 62%,var(--stage1) 0,var(--stage2) 48%,var(--stage3) 100%);border:1px solid #fff;box-shadow:0 1px 0 var(--line),0 24px 48px -28px #1c263340}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink)}
.fallback svg{width:min(80%,560px);height:auto}
.ov{position:absolute;pointer-events:none}
.ov.tl{left:22px;top:20px;right:22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ink2);display:flex;align-items:center;gap:8px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px #ff5a1f2e}
.model{font-weight:900;font-size:clamp(34px,7vw,64px);line-height:1;letter-spacing:-.04em;margin:8px 0 6px;overflow-wrap:anywhere}
.spec{font-size:14px;color:var(--ink2);font-weight:500}
.ov.tr{right:18px;top:18px;text-align:right}
.trend{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:6px 12px}
.ov.br{right:20px;bottom:18px;display:flex;align-items:center;gap:10px;background:#ffffffc9;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:18px;padding:8px 14px 8px 8px;border:1px solid #fff}
.ov.br small{display:block;font-size:11px;color:var(--ink2);font-weight:700}
.ov.br b{font-family:var(--num);font-size:30px;font-weight:700;line-height:1}
.ov.bl{left:22px;bottom:20px;font-size:12px;color:var(--ink3);font-weight:500}
@media (max-width:560px){.ov.tr{top:auto;bottom:94px;right:14px}.stage{height:clamp(300px,48vh,420px)}.ov.bl{display:none}}

/* 도크 */
.dock{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:820px){.dock{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--soft);border-radius:14px;padding:4px;gap:2px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:11px;min-height:40px;font-weight:700;font-size:13px;color:var(--ink2);padding:0 4px}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #1c263326}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-height:112px;transition:border-color .15s,transform .15s}
.opt:hover{transform:translateY(-2px)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt svg{width:100%;height:40px;color:var(--ink);margin-bottom:4px}
.opt b{font-size:14px;font-weight:700}
.opt small{font-size:11.5px;color:var(--ink2);line-height:1.4}
.opt .cost{font-family:var(--num);font-size:14px;font-weight:600;color:var(--ink);margin-top:auto;padding-top:4px}
.paints{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.paint{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.paint i{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 -6px 10px #0000003d,inset 0 5px 8px #ffffff80,0 2px 5px #1c263340}
.paint[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}

.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink3);margin:0 0 8px}
.stat{display:grid;grid-template-columns:72px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13px;font-weight:500;margin-bottom:8px}
.stat .track{height:8px;border-radius:2px;background:var(--soft);overflow:hidden;-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 2px),transparent calc(10% - 2px) 10%);mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 2px),transparent calc(10% - 2px) 10%)}
.stat .track u{display:block;height:100%;background:var(--ink);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.stat b{font-family:var(--num);font-size:16px;font-weight:600;text-align:right}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.namein{width:100%;font:inherit;font-weight:700;min-height:44px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;background:var(--card);color:var(--ink)}
.pricerow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:12px}
.pricerow b{font-family:var(--num);font-size:34px;font-weight:700;line-height:1}
.pricerow b span{font-family:var(--kr);font-size:13px;font-weight:700;margin-left:3px}
.margin{font-size:12.5px;font-weight:700}
.margin.pos{color:var(--pos)}.margin.neg{color:var(--neg)}
input[type=range]{width:100%;accent-color:var(--ink);margin:8px 0 2px}
.go{width:100%;border:0;border-radius:16px;min-height:56px;margin-top:12px;background:var(--accent);color:#fff;font-weight:900;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 22px -10px var(--accent2);transition:transform .12s}
.go:hover{transform:translateY(-1px)}.go:active{transform:translateY(1px)}
.go.dark{background:var(--ink);box-shadow:none}

/* 결과 시트 */
.sheet{position:fixed;inset:0;z-index:20;background:#14171c8c;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.report{background:var(--bg);border-radius:24px;width:min(880px,100%);padding:20px;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(28px);opacity:0}}
.report h2{font-weight:900;font-size:clamp(22px,4vw,30px);letter-spacing:-.03em;margin:6px 0 14px;text-wrap:balance}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;border:1px solid var(--line);min-width:0}
.kpi small{font-size:11.5px;font-weight:700;color:var(--ink2)}
.kpi b{display:block;font-family:var(--num);font-size:clamp(26px,6vw,40px);font-weight:700;line-height:1.05}
.kpi b span{font-family:var(--kr);font-size:13px;margin-left:2px}
.rgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px;margin-top:8px}
@media (max-width:700px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.news{background:#faf7f0;border:1px solid #e3dccb;border-radius:16px;padding:14px 16px}
.news .mast{font-weight:900;letter-spacing:.3em;font-size:11px;border-bottom:2px solid var(--ink);padding-bottom:6px;display:flex;justify-content:space-between}
.news h3{font-size:19px;font-weight:900;line-height:1.3;letter-spacing:-.02em;margin:10px 0 6px;text-wrap:balance}
.news p{font-size:13px;line-height:1.65;color:var(--ink2);margin:0}
.news .score{margin-top:10px;font-weight:700;font-size:13px;color:var(--ink)}
.rank{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.rank div{display:grid;grid-template-columns:18px 28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;font-size:13px;font-weight:500}
.rank div.me{background:var(--ink);color:#fff;font-weight:700}
.rank span.n{font-family:var(--num);font-size:16px;font-weight:600}
.rank span.i{font-family:var(--num);color:var(--ink3)}
.axis{fill:var(--ink3);font-size:10px;font-family:var(--kr)}
.note{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:8px 2px 0}
@media (prefers-reduced-motion:reduce){.report{animation:none}.stat .track u{transition:none}.opt,.go{transition:none}}
</style>

<div class="app">
  <div class="top">
    <div class="brand"><span id="myLogo"></span>가칭 모터스</div>
    <div class="sp"></div>
    <span class="pill">1기 3월 1주</span>
    <span class="pill">자금 <b>120억</b></span>
    <span class="pill">평판 <b>3.1</b></span>
  </div>

  <section class="stage" id="stage">
    <canvas id="cv" aria-label="설계 중인 자동차 3D 미리보기. 끌어서 돌려 볼 수 있습니다."></canvas>
    <div class="fallback" id="fb" hidden></div>
    <div class="ov tl">
      <div class="eyebrow"><i></i>NEW MODEL · 설계 중</div>
      <div class="model" id="mName"></div>
      <div class="spec" id="mSpec"></div>
    </div>
    <div class="ov tr"><span class="trend">이번 분기 유행 · SUV · 전기차</span></div>
    <div class="ov bl">끌어서 돌려 보기</div>
    <div class="ov br">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="21" fill="none" stroke="#d8dde4" stroke-width="6"/><circle id="ring" cx="26" cy="26" r="21" fill="none" stroke="#14171c" stroke-width="6" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="132" transform="rotate(-90 26 26)" style="transition:stroke-dashoffset .5s"/></svg>
      <div><small>예상 평점</small><b id="mScore"></b></div>
    </div>
  </section>

  <section class="dock">
    <div class="panel">
      <div class="seg" role="tablist" id="seg"></div>
      <div id="opts"></div>
    </div>
    <div class="panel">
      <p class="lbl">예상 평가</p>
      <div id="stats"></div>
      <hr>
      <p class="lbl">차 이름</p>
      <input class="namein" id="name" value="미라지 S" maxlength="10" aria-label="차 이름">
      <div class="pricerow"><b class="num" id="priceOut"></b><span class="margin" id="marginOut"></span></div>
      <input type="range" id="price" min="1500" max="6500" step="50" value="3400" aria-label="판매 가격(만원)">
      <button class="go" id="go">출시하기 <span aria-hidden="true">→</span></button>
      <p class="note">숫자는 데모용 가짜 계산입니다.</p>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="report" role="dialog" aria-labelledby="rTitle">
    <div class="eyebrow"><i></i>출시 6개월 리포트</div>
    <h2 id="rTitle"></h2>
    <div class="kpis">
      <div class="kpi"><small>판매량</small><b><i id="kU" style="font-style:normal">0</i><span>대</span></b></div>
      <div class="kpi"><small>매출</small><b><i id="kR" style="font-style:normal">0</i><span>억</span></b></div>
      <div class="kpi"><small>순이익</small><b id="kPw"><i id="kP" style="font-style:normal">0</i><span>억</span></b></div>
    </div>
    <div class="rgrid">
      <div class="kpi"><small>월별 판매량 (대)</small><svg id="chart" viewBox="0 0 360 170" width="100%"></svg>
        <small>이번 분기 판매 순위</small><div class="rank" id="rank"></div></div>
      <div><div class="news"><div class="mast"><span>모터 데일리</span><span>1기 9월호</span></div><h3 id="nH"></h3><p id="nB"></p><div class="score" id="nS"></div></div>
        <button class="go dark" id="again">다음 차 설계하기</button>
        <p class="note">회사 이름과 로고는 실제 브랜드를 비튼 가짜이며, 도형은 새로 그렸습니다.</p></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
/* ── 데이터 ── 치수 단위는 m */
const BODY={
  sedan:{n:'세단',sub:'무난한 균형',L:4.6,W:1.78,clr:.2,belt:.92,roof:1.42,cR:-1.05,cF:.55,rr:.55,rf:.7,wr:.33,wb:1.4,deck:1,pr:6,de:6,cost:2400,sweet:3200},
  suv:{n:'SUV',sub:'넓고 높음 · 유행',L:4.6,W:1.86,clr:.3,belt:1.08,roof:1.72,cR:-1.75,cF:.6,rr:.25,rf:.6,wr:.39,wb:1.4,deck:0,pr:9,de:6,cost:2900,sweet:3900},
  hatch:{n:'해치백',sub:'작고 저렴',L:4.0,W:1.72,clr:.2,belt:.92,roof:1.46,cR:-1.4,cF:.45,rr:.3,rf:.6,wr:.31,wb:1.25,deck:0,pr:7,de:5,cost:1700,sweet:2200},
  coupe:{n:'쿠페',sub:'멋 위주 · 좁음',L:4.5,W:1.82,clr:.15,belt:.84,roof:1.26,cR:-.75,cF:.35,rr:.95,rf:.8,wr:.34,wb:1.38,deck:1,pr:3,de:9,cost:3000,sweet:4500}};
const ENG={
  eco:{n:'경제형 1.6',sub:'연비가 좋고 저렴',pf:3,ef:9,cost:0,ic:'<path d="M26 34C26 18 38 8 56 8c0 17-9 28-26 28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M30 34c5-10 12-16 20-20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>'},
  turbo:{n:'터보 2.0',sub:'힘이 좋음 · 스포일러',pf:8,ef:4,cost:500,ic:'<circle cx="40" cy="21" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M40 21c0-6 3-9 8-10M40 21c5 3 6 8 4 12M40 21c-6 3-10 1-13-3" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="40" cy="21" r="2.5" fill="currentColor"/>'},
  ev:{n:'전기 모터',sub:'유행 · 원가 비쌈',pf:6,ef:10,cost:1400,ic:'<path d="M44 4 30 23h9l-3 14 14-19h-9z" fill="currentColor"/>'}};
const WHEEL={
  w17:{n:'17인치',sub:'기본',d:0,de:0,ef:0,cost:0},
  w19:{n:'19인치',sub:'디자인 +1 · 연비 −0.5',d:.03,de:1,ef:-.5,cost:80},
  w21:{n:'21인치',sub:'디자인 +2 · 연비 −1',d:.06,de:2,ef:-1,cost:200}};
const PAINT=[['카민 레드','#c8202f'],['선셋 오렌지','#f26a1b'],['포레스트','#1f5c4a'],['코발트','#1f4fd1'],['펄 화이트','#eef0f2'],['그래파이트','#3a3f47'],['미드나잇','#14213d'],['샴페인','#c9b38a']];
const RIV=[['도요다','toyotto',5210],['현다이','hyundoy',4480],['비엠브이','bmv',2650],['테슬러','tesler',2310],['포티','forty',1790]];
const s={body:'sedan',eng:'turbo',wheel:'w19',color:PAINT[0][1],price:3400,tab:'body'};

function logo(k,z=26){const g={
 me:`<rect x="2" y="2" width="28" height="28" rx="9" fill="#14171c"/><path d="M8 21h13M11 16h14M14 11h11" stroke="#ff5a1f" stroke-width="3" stroke-linecap="round"/>`,
 toyotto:`<ellipse cx="16" cy="16" rx="14" ry="9.5" fill="none" stroke="#c0392b" stroke-width="2.5"/><ellipse cx="16" cy="16" rx="6" ry="9.5" fill="none" stroke="#c0392b" stroke-width="2.5"/>`,
 hyundoy:`<rect x="5" y="5" width="22" height="22" rx="4" transform="rotate(45 16 16)" fill="none" stroke="#1f4e9c" stroke-width="2.5"/><path d="M11 22l4-12M17 22l4-12M12.5 17h8" stroke="#1f4e9c" stroke-width="2.4" stroke-linecap="round"/>`,
 bmv:`<circle cx="16" cy="16" r="13" fill="#fff" stroke="#555" stroke-width="2.5"/><path d="M16 16V4a12 12 0 0 1 12 12z" fill="#2a77c9"/><path d="M16 16v12A12 12 0 0 1 4 16z" fill="#2a77c9"/>`,
 tesler:`<path d="M16 3l11 4v9c0 7-5 11-11 13C10 27 5 23 5 16V7z" fill="#fff" stroke="#d6252b" stroke-width="2.4"/><path d="M10 11h12M16 11v11" stroke="#d6252b" stroke-width="2.6" stroke-linecap="round"/>`,
 forty:`<rect x="2" y="8" width="28" height="16" rx="8" fill="#1d3c8f"/><text x="16" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="sans-serif">40</text>`}[k];
 return `<svg width="${z}" height="${z}" viewBox="0 0 32 32" aria-hidden="true" style="display:block">${g}</svg>`;}
$('myLogo').innerHTML=logo('me',26);

/* 옆모습 아이콘: 3D와 같은 치수에서 뽑는다 */
function sil(p,wr=p.wr){const h=p.L/2,f=n=>n.toFixed(2);
  const pts=[[-h,p.clr],[h,p.clr],[h,p.belt-.2],[p.cF+p.rf,p.belt],[p.cF,p.roof],[p.cR,p.roof],[p.cR-p.rr,p.belt],[-h,p.belt-.06]];
  return `<svg viewBox="-2.6 -1.95 5.2 2.05" aria-hidden="true"><g transform="scale(1,-1)"><path d="M${pts.map(q=>f(q[0])+' '+f(q[1])).join('L')}Z" fill="currentColor" stroke="currentColor" stroke-width=".16" stroke-linejoin="round"/>${[-p.wb,p.wb].map(x=>`<circle cx="${x}" cy="${wr}" r="${wr+.07}" fill="#fff"/><circle cx="${x}" cy="${wr}" r="${wr-.03}" fill="currentColor"/><circle cx="${x}" cy="${wr}" r="${wr*.45}" fill="#fff"/>`).join('')}</g></svg>`}

/* ── 3D 무대 ── */
let three=null;
const col=h=>new THREE.Color(h).convertSRGBToLinear();
function initThree(){
  const cv=$('cv'),st=$('stage');

  $('nB').textContent=profit<0?'대당 이익이 마이너스라 팔수록 손해라는 지적이 나온다. 업계는 가격 재조정을 점치고 있다.':rv>=7.5?'판매 첫 달부터 대기자가 몰렸다. 전시장 직원은 “색상 문의가 특히 많다”고 전했다.':'평가는 갈렸다. 개선을 바라는 목소리와 이만하면 됐다는 반응이 엇갈린다.';
  $('nS').textContent='시승 평가 '+rv.toFixed(1)+' / 10';
  // 그래프: 축과 선이 같은 척도를 쓴다
  const W=360,H=170,L=40,Rt=12,T=12,B=24,st=Math.pow(10,Math.floor(Math.log10(Math.max(...m,1)))),mx=Math.ceil(Math.max(...m,1)/st)*st;
  const x=i=>L+i*(W-L-Rt)/5,y=q=>T+(1-q/mx)*(H-T-B),pts=m.map((q,i)=>x(i)+','+y(q)).join(' ');
  $('chart').innerHTML=[0,mx/2,mx].map(q=>`<line x1="${L}" x2="${W-Rt}" y1="${y(q)}" y2="${y(q)}" stroke="#d8dde4"/><text class="axis" x="${L-6}" y="${y(q)+3}" text-anchor="end">${q.toLocaleString()}</text>`).join('')
    +m.map((_,i)=>`<text class="axis" x="${x(i)}" y="${H-6}" text-anchor="middle">${i+1}개월</text>`).join('')
    +`<polygon points="${L},${y(0)} ${pts} ${x(5)},${y(0)}" fill="#ff5a1f" opacity=".12"/><polyline points="${pts}" fill="none" stroke="#ff5a1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(5)}" cy="${y(m[5])}" r="5" fill="#ff5a1f" stroke="#fff" stroke-width="2"/>`;
  const list=[...RIV.map(q=>({n:q[0],k:q[1],v:q[2]})),{n:'가칭 모터스',k:'me',v:Math.round(units/6),me:1}].sort((a,b)=>b.v-a.v);
  $('rank').innerHTML=list.map((o,i)=>`<div class="${o.me?'me':''}"><span class="i">${i+1}</span>${logo(o.k,24)}<span>${o.n}</span><span class="n">${o.v.toLocaleString()}</span></div>`).join('');
  $('again').focus();
}
$('go').onclick=launch;$('again').onclick=()=>{$('sheet').hidden=true;$('go').focus()};
$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').hidden=true};
addEventListener('keydown',e=>{if(e.key==='Escape')$('sheet').hidden=true});

try{if(!window.THREE)throw 0;initThree();buildCar()}catch(e){three=null;$('cv').hidden=true}
renderOpts();renderInfo();drawFallback();
</script>
